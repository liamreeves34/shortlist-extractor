# Builds the Docker image and publishes it to GitHub Container Registry
# whenever you push a version tag, for example:
#   git tag v0.1.0 ; git push origin v0.1.0
# The image appears as ghcr.io/<your-username>/shortlist-extractor:0.1.0 (and :latest).

name: Publish image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write # lets the workflow's built-in token push to GHCR

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
