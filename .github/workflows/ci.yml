name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The branch ruleset on main requires this job by name.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Installs uv; uv reads .python-version and fetches Python 3.12.
      # setup-uv publishes no floating major tag (no @v10), so pin the exact release.
      - uses: astral-sh/setup-uv@v10.3.0

      - name: Install dependencies (fails if uv.lock is stale)
        run: uv sync --locked

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest
